services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pickmeal-postgres
    environment:
      POSTGRES_DB: ${PICKMEAL_POSTGRES_DB:-pickmeal}
      POSTGRES_USER: ${PICKMEAL_POSTGRES_USER:-pickmeal}
      POSTGRES_PASSWORD: ${PICKMEAL_POSTGRES_PASSWORD:-pickmeal}
    ports:
      - "5432:5432"
    volumes:
      - pickmeal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PICKMEAL_POSTGRES_USER:-pickmeal} -d ${PICKMEAL_POSTGRES_DB:-pickmeal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pickmeal-api
    ports:
      - "8000:8000"
    environment:
      PICKMEAL_OCR_BACKEND: ${PICKMEAL_OCR_BACKEND_DOCKER:-rapidocr}
      PICKMEAL_OCR_FALLBACK_BACKEND: ${PICKMEAL_OCR_FALLBACK_BACKEND_DOCKER:-rapidocr}
      PICKMEAL_OCR_LANGS: ${PICKMEAL_OCR_LANGS:-en}
      PICKMEAL_PADDLE_DET_MODEL: ${PICKMEAL_PADDLE_DET_MODEL:-PP-OCRv5_server_det}
      PICKMEAL_OCR_MAX_IMAGE_SIDE: ${PICKMEAL_OCR_MAX_IMAGE_SIDE:-2560}
      PICKMEAL_OCR_SERVICE_URL: http://ocr:8001
      PICKMEAL_PARSER_SERVICE_URL: http://parser:8002
      PICKMEAL_RECOMMENDATION_SERVICE_URL: http://recommendation:8003
      PICKMEAL_LLM_SERVICE_URL: http://llm:8004
      PICKMEAL_DATASET_SUMMARY_PATH: ${PICKMEAL_DATASET_SUMMARY_PATH:-data/interim/dataset_summary.json}
      PICKMEAL_DATABASE_URL: ${PICKMEAL_DATABASE_URL_DOCKER:-postgresql://pickmeal:pickmeal@postgres:5432/pickmeal}
      PICKMEAL_EMBEDDING_DIMENSIONS: ${PICKMEAL_EMBEDDING_DIMENSIONS:-256}
      PICKMEAL_EMBEDDING_MODEL: ${PICKMEAL_EMBEDDING_MODEL:-hashing_v1}
      PICKMEAL_LLM_ENABLED: ${PICKMEAL_LLM_ENABLED:-false}
      PICKMEAL_LLM_BASE_URL: ${PICKMEAL_LLM_BASE_URL:-}
      PICKMEAL_LLM_API_KEY: ${PICKMEAL_LLM_API_KEY:-}
      PICKMEAL_LLM_MODEL: ${PICKMEAL_LLM_MODEL:-}
      PICKMEAL_LLM_TIMEOUT_SECONDS: ${PICKMEAL_LLM_TIMEOUT_SECONDS:-45}
      PICKMEAL_LLM_MAX_ITEMS_PER_REQUEST: ${PICKMEAL_LLM_MAX_ITEMS_PER_REQUEST:-6}
      PICKMEAL_PADDLE_CACHE_DIR: /app/.cache/paddlex_cache
      PICKMEAL_PADDLE_MPLCONFIGDIR: /app/.cache/matplotlib_cache
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"
    volumes:
      - pickmeal_cache:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy
      parser:
        condition: service_healthy
      recommendation:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pickmeal-ocr
    environment:
      PICKMEAL_OCR_BACKEND: ${PICKMEAL_OCR_BACKEND_DOCKER:-rapidocr}
      PICKMEAL_OCR_FALLBACK_BACKEND: ${PICKMEAL_OCR_FALLBACK_BACKEND_DOCKER:-rapidocr}
      PICKMEAL_ALLOW_PADDLE_DOCKER_ARM: ${PICKMEAL_ALLOW_PADDLE_DOCKER_ARM:-false}
      PICKMEAL_OCR_LANGS: ${PICKMEAL_OCR_LANGS:-en}
      PICKMEAL_PADDLE_DET_MODEL: ${PICKMEAL_PADDLE_DET_MODEL:-PP-OCRv5_server_det}
      PICKMEAL_OCR_MAX_IMAGE_SIDE: ${PICKMEAL_OCR_MAX_IMAGE_SIDE:-2560}
      PICKMEAL_PADDLE_CACHE_DIR: /app/.cache/paddlex_cache
      PICKMEAL_PADDLE_MPLCONFIGDIR: /app/.cache/matplotlib_cache
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"
    command: ["uvicorn", "service.app.ocr_app:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - pickmeal_cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  parser:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pickmeal-parser
    command: ["uvicorn", "service.app.parser_app:app", "--host", "0.0.0.0", "--port", "8002"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  recommendation:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pickmeal-recommendation
    environment:
      PICKMEAL_EMBEDDING_DIMENSIONS: ${PICKMEAL_EMBEDDING_DIMENSIONS:-256}
      PICKMEAL_EMBEDDING_MODEL: ${PICKMEAL_EMBEDDING_MODEL:-hashing_v1}
    command: ["uvicorn", "service.app.recommendation_app:app", "--host", "0.0.0.0", "--port", "8003"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  llm:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pickmeal-llm
    environment:
      PICKMEAL_DATABASE_URL: ${PICKMEAL_DATABASE_URL_DOCKER:-postgresql://pickmeal:pickmeal@postgres:5432/pickmeal}
      PICKMEAL_EMBEDDING_DIMENSIONS: ${PICKMEAL_EMBEDDING_DIMENSIONS:-256}
      PICKMEAL_EMBEDDING_MODEL: ${PICKMEAL_EMBEDDING_MODEL:-hashing_v1}
      PICKMEAL_RAG_ENABLED: ${PICKMEAL_RAG_ENABLED:-true}
      PICKMEAL_RAG_DATASET_PATH: ${PICKMEAL_RAG_DATASET_PATH:-data/processed/gold/full_gold_dataset.csv}
      PICKMEAL_LLM_ENABLED: ${PICKMEAL_LLM_ENABLED:-false}
      PICKMEAL_LLM_BASE_URL: ${PICKMEAL_LLM_BASE_URL:-}
      PICKMEAL_LLM_API_KEY: ${PICKMEAL_LLM_API_KEY:-}
      PICKMEAL_LLM_MODEL: ${PICKMEAL_LLM_MODEL:-}
      PICKMEAL_LLM_TIMEOUT_SECONDS: ${PICKMEAL_LLM_TIMEOUT_SECONDS:-45}
      PICKMEAL_LLM_MAX_ITEMS_PER_REQUEST: ${PICKMEAL_LLM_MAX_ITEMS_PER_REQUEST:-6}
    command: ["uvicorn", "service.app.llm_app:app", "--host", "0.0.0.0", "--port", "8004"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pickmeal-streamlit
    ports:
      - "8501:8501"
    environment:
      PICKMEAL_API_URL: ${PICKMEAL_API_URL_DOCKER:-http://api:8000}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pickmeal_cache:
  pickmeal_postgres_data:
